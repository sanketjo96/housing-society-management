name: Publish site

# Rebuilds the gh-pages branch (marketing site + clickable demo) whenever the
# site or the demo changes on the product branch.
on:
  push:
    branches: [product]
    paths:
      - 'website/**'
      - 'demo/**'
      - '.github/workflows/publish-site.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-site
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build site
        run: ./website/build.sh _site

      - name: Push to gh-pages
        working-directory: _site
        env:
          SRC_SHA: ${{ github.sha }}
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish site from product@${SRC_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
