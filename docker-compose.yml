services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./server
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      PORT: "3000"
      NODE_ENV: production
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE}
      # Gates POST /api/platform/societies (docs/society-onboarding/ Phase A) — see
      # the root .env's own comment for why this can't be a JWT-protected endpoint.
      PLATFORM_BOOTSTRAP_SECRET: ${PLATFORM_BOOTSTRAP_SECRET:-}
      # Task 6.2/6.3's storage adapter (src/infrastructure/storage) — 'local' (default)
      # writes payment-proof/signature/receipt files under LOCAL_STORAGE_DIR, backed by
      # the uploads_data volume below so files survive container restarts/redeploys.
      # 's3' (2026-08-26 — Cloudflare R2, or any S3-compatible endpoint) is also
      # implemented now; set STORAGE_PROVIDER=s3 in the root .env plus the five S3_*
      # vars below to switch — no other file in this compose config needs to change.
      # 'gdrive' remains a named-but-unimplemented extension point.
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      LOCAL_STORAGE_DIR: /app/uploads
      # Only read lazily, inside getS3Config() (src/infrastructure/storage/s3.config.ts),
      # at the point a file is actually saved/read/deleted — not at server startup —
      # so leaving these unset doesn't block `docker compose up` while
      # STORAGE_PROVIDER stays 'local'. S3_ENDPOINT for Cloudflare R2:
      # https://<account_id>.r2.cloudflarestorage.com — S3_REGION defaults to R2's
      # documented 'auto' value if unset.
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      # Weekly Postgres backup job (src/jobs/database-backup.job.ts, Sundays 02:30
      # IST) — src/infrastructure/backup/backup-s3.config.ts. Deliberately a SEPARATE
      # bucket + credential from S3_* above (docs/decisions/0005-storage-provider-r2.md):
      # the live-file credential has delete access, so it must never also be able to
      # reach backup copies. Read lazily, only when the job actually runs — leaving
      # these unset just logs a failed run each week, never blocks anything else.
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-auto}
      BACKUP_S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      BACKUP_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      # Phase 7's swappable EmailProvider (src/lib/email) — defaults to logging reset
      # links instead of sending (no account needed) unless EMAIL_PROVIDER=resend and
      # the two Resend vars below are set in the root .env. APP_BASE_URL builds the
      # /reset-password link residents click — point it at wherever this stack is
      # actually reachable.
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-console}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost}
      # Notification feature (docs/notification/), Phase 1: WhatsApp only, via the
      # Meta Cloud API. Left unset by default — the delivery sweep (every minute,
      # src/jobs/notification-delivery.job.ts) just marks queued notifications FAILED
      # with a clear "must be set" error until these are filled in and the three
      # WhatsApp templates are Meta-approved (docs/notification/requirements.md §5);
      # it does not block server startup or any billing/payment flow.
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION:-v21.0}
      # TEMPORARY, for manual end-to-end testing only: 'true' sends Meta's pre-approved
      # hello_world sample template instead of the real per-event templates, so the
      # pipeline can be proven with a real delivery before those are approved. Leave
      # unset/false otherwise (see whatsapp.service.ts).
      WHATSAPP_TEST_MODE: ${WHATSAPP_TEST_MODE:-false}
      # 2026-08-24: operational kill switch for the WHATSAPP channel specifically —
      # set to 'false' to stop notify() from creating new WHATSAPP-channel rows and
      # stop deliverPending() from touching any already-queued ones (e.g. while
      # WHATSAPP_ACCESS_TOKEN is a dead/expired credential). Email is unaffected
      # either way — see notification.service.ts.
      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-true}
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./client
    volumes:
      - frontend_dist:/output

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - frontend_dist:/usr/share/nginx/html:ro
      # Directory mount, not a single file — nginx loads every *.conf here. Ships
      # HTTP-only (nginx/conf.d/default.conf) until scripts/enable-https.sh (Task
      # 10.2) overwrites that file with nginx/https.conf.template once a real
      # cert exists; a directory mount also sidesteps the stale-bind-mount-inode
      # gotcha a single-file mount had (docs/docker-compose.md).
      - ./nginx/conf.d:/etc/nginx/conf.d
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - backend

  # Task 10.2: obtains and auto-renews the Let's Encrypt cert for ${DOMAIN} (a free
  # dynamic-DNS hostname is enough — Let's Encrypt just needs a real FQDN pointing at
  # this VPS, not a purchased domain). Idle until scripts/enable-https.sh is run; the
  # renew-loop is harmless to leave running even before a cert exists.
  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-}
      CERTBOT_EMAIL: ${CERTBOT_EMAIL:-}
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h; done'"

volumes:
  postgres_data:
  frontend_dist:
  uploads_data:
  certbot_certs:
  certbot_www:
