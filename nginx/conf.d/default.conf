## Generated by scripts/enable-https.sh — do not hand-edit this template in a live
## deployment; edit and re-run the script instead so both files stay in sync.
## saralsociety.duckdns.org is replaced with the real value from root .env's DOMAIN.

server {
    listen 80;
    server_name saralsociety.duckdns.org;

    # Kept alive on plain 80 so certbot's renewal (every ~60 days, via the `certbot`
    # compose service) can keep re-solving the HTTP-01 challenge without any nginx
    # config changes ever again.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name saralsociety.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/saralsociety.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/saralsociety.duckdns.org/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
