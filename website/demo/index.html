<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Saral Society Demo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: dark ink sidebar beside a pale paper workspace; the building facade (6 floors x 4 flats) is the recurring motif. */
:root {
  --paper: #F1F4EE; --surface: #FFFFFF; --surface-2: #F7F9F5; --sunken: #EBEFE7;
  --ink: #182420; --ink-2: #3B4A43; --muted: #66706A; --line: #D9DFD5; --line-2: #E7EBE3;
  --teal: #2F6E64; --teal-strong: #245A51; --teal-soft: #E2EDEA; --on-teal: #FFFFFF;
  --brass: #A87A30; --brass-bright: #B8863A; --brass-soft: #F5EBD8;
  --coral: #B9493A; --coral-soft: #F6E4E0; --blue: #35577D; --blue-soft: #E3EBF5;
  --panel: #182420; --panel-2: #22302B; --panel-fg: #E9EDE6; --panel-muted: #94A099; --panel-line: #2E3D37;
  --shadow: 0 1px 2px rgba(24,36,32,.05), 0 8px 24px -12px rgba(24,36,32,.18);
  --shadow-lg: 0 24px 64px -20px rgba(24,36,32,.45);
  --display: "Source Serif 4", Georgia, "Times New Roman", serif;
  --body: "Hanken Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0F1513; --surface: #161E1B; --surface-2: #1B2420; --sunken: #121916;
  --ink: #E8ECE5; --ink-2: #C2CAC2; --muted: #8D9891; --line: #2B3632; --line-2: #222C28;
  --teal: #62A898; --teal-strong: #7AB9AA; --teal-soft: #1C322D; --on-teal: #0B110F;
  --brass: #D2A35A; --brass-bright: #D2A35A; --brass-soft: #362B19;
  --coral: #E27D69; --coral-soft: #3A221D; --blue: #8DAED4; --blue-soft: #1D2938;
  --panel: #0B100E; --panel-2: #151D1A; --panel-fg: #E9EDE6; --panel-muted: #8D9891; --panel-line: #222C28;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.6); --shadow-lg: 0 24px 64px -20px rgba(0,0,0,.8);
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #0F1513; --surface: #161E1B; --surface-2: #1B2420; --sunken: #121916;
  --ink: #E8ECE5; --ink-2: #C2CAC2; --muted: #8D9891; --line: #2B3632; --line-2: #222C28;
  --teal: #62A898; --teal-strong: #7AB9AA; --teal-soft: #1C322D; --on-teal: #0B110F;
  --brass: #D2A35A; --brass-bright: #D2A35A; --brass-soft: #362B19;
  --coral: #E27D69; --coral-soft: #3A221D; --blue: #8DAED4; --blue-soft: #1D2938;
  --panel: #0B100E; --panel-2: #151D1A; --panel-fg: #E9EDE6; --panel-muted: #8D9891; --panel-line: #222C28;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.6); --shadow-lg: 0 24px 64px -20px rgba(0,0,0,.8);
  color-scheme: dark; }

html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--brass-bright); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--display); font-weight: 500; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); font-weight: 600; }
.muted { color: var(--muted); }
#root { min-height: 100%; }

/* ---------- Buttons & fields ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 10px; padding: 9px 15px; font-weight: 600; font-size: 13.5px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); transition: background .15s, border-color .15s, transform .05s; white-space: nowrap; }
.btn:hover { border-color: var(--ink-2); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--teal); border-color: var(--teal); color: var(--on-teal); }
.btn.primary:hover { background: var(--teal-strong); border-color: var(--teal-strong); }
.btn.danger { color: var(--coral); border-color: color-mix(in srgb, var(--coral) 40%, var(--line)); }
.btn.danger:hover { background: var(--coral-soft); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--sunken); }
.btn.sm { padding: 6px 11px; font-size: 12.5px; border-radius: 8px; }
.btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field label { font-size: 12px; font-weight: 600; color: var(--ink-2); display: flex; justify-content: space-between; gap: 8px; }
.input { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 12px; font-size: 14px; outline: none; transition: border-color .15s, box-shadow .15s; }
.input:focus { border-color: var(--teal); box-shadow: 0 0 0 3px var(--teal-soft); }
.input:disabled, .input[readonly] { background: var(--sunken); color: var(--muted); }
textarea.input { resize: vertical; min-height: 84px; }
.lock { font-size: 11px; color: var(--muted); font-weight: 500; display: inline-flex; gap: 4px; align-items: center; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 640px) { .grid2, .grid3 { grid-template-columns: 1fr; } }

/* ---------- Badges ---------- */
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.settled, .pill.approved, .pill.resolved, .pill.delivered, .pill.read, .pill.confirmed { color: var(--teal); background: var(--teal-soft); }
.pill.pending, .pill.progress, .pill.queued, .pill.requested { color: var(--brass); background: var(--brass-soft); }
.pill.overdue, .pill.rejected, .pill.failed, .pill.open, .pill.declined { color: var(--coral); background: var(--coral-soft); }
.pill.due, .pill.sent { color: var(--blue); background: var(--blue-soft); }
.tag { font-family: var(--mono); font-size: 10.5px; font-weight: 600; letter-spacing: .04em; padding: 2px 7px; border-radius: 5px; border: 1px solid var(--line); color: var(--ink-2); background: var(--surface-2); }
.tag.SYSTEM { color: var(--ink-2); }
.tag.DEPOSIT { color: var(--blue); border-color: color-mix(in srgb, var(--blue) 35%, var(--line)); background: var(--blue-soft); }
.tag.CREDIT { color: var(--brass); border-color: color-mix(in srgb, var(--brass) 35%, var(--line)); background: var(--brass-soft); }

/* ---------- Login ---------- */
.login-wrap { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; padding-block: 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.login-card { width: min(980px, 100%); display: grid; grid-template-columns: 1fr 1.05fr; background: var(--surface); border: 1px solid var(--line); border-radius: 22px; overflow: hidden; box-shadow: var(--shadow-lg); }
.login-hero { background: var(--panel); color: var(--panel-fg); padding: 44px 44px 36px; display: flex; flex-direction: column; gap: 30px; position: relative; overflow: hidden; }
.login-hero::after { content: ""; position: absolute; inset: auto -80px -120px auto; width: 320px; height: 320px; border-radius: 50%; background: radial-gradient(circle, rgba(184,134,58,.18), transparent 70%); pointer-events: none; }
.brand { display: flex; align-items: center; gap: 12px; }
.brand-name { font-family: var(--display); font-size: 34px; font-weight: 500; letter-spacing: -0.015em; line-height: 1; }
.brand-tag { font-size: 17px; color: var(--panel-muted); line-height: 1.45; max-width: 26ch; font-family: var(--display); }
.facade { display: grid; grid-template-columns: auto repeat(4, 1fr); gap: 7px; align-items: center; max-width: 230px; }
.facade .fl { font-family: var(--mono); font-size: 10px; color: var(--panel-muted); width: 14px; }
.unit { aspect-ratio: 1; border-radius: 5px; border: 1px solid rgba(255,255,255,.08); transition: transform .2s; }
.unit.settled { background: #2F6E64; } .unit.pending { background: #B8863A; } .unit.overdue { background: #C1503D; } .unit.due { background: #4E7398; } .unit.none { background: transparent; border: 1.5px dashed #56645D; }
button.unit { padding: 0; cursor: pointer; }
button.unit:hover { transform: scale(1.12); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 11.5px; color: var(--panel-muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
.login-form { padding: 44px 48px 36px; display: flex; flex-direction: column; gap: 18px; }
.input-icon { position: relative; }
.input-icon > svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.input-icon .input { padding-left: 38px; }
.input-icon .eye { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); border: none; background: none; padding: 6px; color: var(--muted); border-radius: 6px; }
.error { background: var(--coral-soft); color: var(--coral); border-radius: 10px; padding: 10px 12px; font-size: 13px; display: flex; gap: 8px; align-items: flex-start; }
.personas { width: min(980px, 100%); display: flex; flex-direction: column; gap: 12px; }
.persona-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.persona { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px; transition: border-color .15s, box-shadow .2s, transform .15s; }
.persona:hover { border-color: var(--teal); box-shadow: var(--shadow); transform: translateY(-2px); }
.avatar { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 13px; flex: none; }
.persona .dest { font-size: 11.5px; color: var(--muted); display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--line-2); padding-top: 10px; }
@media (max-width: 860px) { .login-card { grid-template-columns: 1fr; } .login-hero { padding: 32px 28px; } .login-form { padding: 32px 28px; } .persona-row { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 460px) { .persona-row { grid-template-columns: 1fr; } .brand-name { font-size: 30px; } }

/* ---------- Admin shell ---------- */
.shell { display: grid; grid-template-columns: 252px minmax(0, 1fr); min-height: 100%; }
.side { background: var(--panel); color: var(--panel-fg); padding: 22px 14px; display: flex; flex-direction: column; gap: 20px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.side .brand-name { font-size: 22px; }
.soc { background: var(--panel-2); border: 1px solid var(--panel-line); border-radius: 12px; padding: 11px 12px; }
.soc b { font-family: var(--display); font-weight: 500; font-size: 15px; display: block; }
.soc span { font-size: 11.5px; color: var(--panel-muted); }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav-group { font-size: 10.5px; text-transform: uppercase; letter-spacing: .1em; color: var(--panel-muted); padding: 14px 10px 6px; font-weight: 600; }
.nav button { display: flex; align-items: center; gap: 11px; padding: 8px 10px; border-radius: 9px; border: none; background: transparent; color: var(--panel-fg); font-size: 13.5px; font-weight: 500; text-align: left; opacity: .82; }
.nav button:hover { background: var(--panel-2); opacity: 1; }
.nav button.on { background: var(--panel-2); opacity: 1; box-shadow: inset 0 0 0 1px var(--panel-line); }
.nav button.on svg { color: var(--brass-bright); }
.nav .count { margin-left: auto; font-family: var(--mono); font-size: 11px; background: #B8863A; color: #182420; border-radius: 999px; padding: 0 7px; font-weight: 600; }
.main { min-width: 0; display: flex; flex-direction: column; }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--paper) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
@media (min-width: 900px) { .topbar { padding-left: 32px; padding-right: 32px; } }
.crumb { font-size: 13px; color: var(--muted); }
.crumb b { color: var(--ink); font-weight: 600; }
.me { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.me .who { text-align: right; line-height: 1.25; }
.me .who b { display: block; font-size: 13px; }
.me .who span { font-size: 11.5px; color: var(--muted); }
.content { padding-block: 28px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 22px; max-width: 1280px; width: 100%; }
@media (min-width: 900px) { .content { padding-left: 32px; padding-right: 32px; } }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.page-head h1 { font-size: 30px; line-height: 1.15; }
.page-head p { margin: 6px 0 0; color: var(--muted); max-width: 62ch; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.mobile-nav { display: none; }
@media (max-width: 900px) {
  .shell { grid-template-columns: 1fr; }
  .side { display: none; }
  .mobile-nav { display: flex; gap: 6px; overflow-x: auto; background: var(--panel); padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); scrollbar-width: none; }
  .mobile-nav button { flex: none; border: 1px solid var(--panel-line); background: transparent; color: var(--panel-fg); border-radius: 999px; padding: 6px 12px; font-size: 12.5px; display: inline-flex; gap: 6px; align-items: center; }
  .mobile-nav button.on { background: var(--panel-fg); color: var(--panel); }
  .me .who { display: none; }
}

/* ---------- Surfaces ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; }
.card-pad { padding: 20px 22px; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 22px; border-bottom: 1px solid var(--line-2); flex-wrap: wrap; }
.card-head h2 { font-size: 18px; }
.metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.metric { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; display: flex; flex-direction: column; gap: 8px; }
.metric .val { font-family: var(--display); font-size: 30px; line-height: 1; letter-spacing: -0.01em; font-variant-numeric: tabular-nums lining-nums; }
.metric .sub { font-size: 12px; color: var(--muted); }
.metric.hero { background: var(--panel); color: var(--panel-fg); border-color: var(--panel); }
.metric.hero .eyebrow, .metric.hero .sub { color: var(--panel-muted); }
.metric.hero .val { color: #F1D9AE; }
@media (max-width: 1080px) { .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.split { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 18px; align-items: start; }
@media (max-width: 1080px) { .split { grid-template-columns: 1fr; } }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: 12.5px; font-weight: 500; }
.chip.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.chip .c { font-family: var(--mono); font-size: 11px; opacity: .7; margin-left: 4px; }
.search { position: relative; min-width: 0; }
.search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.search .input { padding: 7px 10px 7px 32px; font-size: 13px; width: 220px; max-width: 100%; }

/* ---------- Tables ---------- */
.table-wrap { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.t th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; padding: 11px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--surface-2); }
.t th.r, .t td.r { text-align: right; }
.t th button { border: none; background: none; padding: 0; font: inherit; color: inherit; text-transform: inherit; letter-spacing: inherit; display: inline-flex; gap: 3px; align-items: center; }
.t th button.on { color: var(--ink); }
.t td { padding: 12px 14px; border-bottom: 1px solid var(--line-2); vertical-align: middle; }
.t tr:last-child td { border-bottom: none; }
.t tbody tr.click { cursor: pointer; }
.t tbody tr.click:hover td { background: var(--surface-2); }
.t tr.tint-CREDIT td { background: color-mix(in srgb, var(--brass-soft) 55%, transparent); }
.t tr.tint-DEPOSIT td { background: color-mix(in srgb, var(--blue-soft) 45%, transparent); }
.flatno { font-family: var(--mono); font-weight: 600; font-size: 13px; white-space: nowrap; }
.t td.num, .t td.r { white-space: nowrap; }
.person > div { white-space: nowrap; }
.person { display: flex; align-items: center; gap: 10px; min-width: 0; }
.person .avatar { width: 30px; height: 30px; font-size: 11px; }
.person small { display: block; color: var(--muted); font-size: 11.5px; }

/* ---------- Facade card ---------- */
.facade-card { background: var(--panel); color: var(--panel-fg); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
.facade-card .facade { gap: 8px; }
.facade-wrap { max-width: 250px; width: 100%; }
.facade-card .facade-wrap { max-width: 270px; align-self: center; }
.facade-card h2 { font-size: 18px; }
.roof { height: 10px; border-radius: 6px 6px 0 0; background: linear-gradient(90deg, transparent, #2E3D37 15%, #2E3D37 85%, transparent); margin: 0 0 2px 22px; }
.ground { border-top: 2px solid #2E3D37; margin-left: 22px; padding-top: 6px; font-family: var(--mono); font-size: 10px; color: var(--panel-muted); text-align: center; letter-spacing: .2em; }

/* ---------- Chart ---------- */
.chart text { fill: var(--muted); font-family: var(--mono); font-size: 10px; }
.chart .grid { stroke: var(--line-2); }
.chart .billed { fill: var(--sunken); stroke: var(--line); }
.chart .coll { fill: var(--teal); }
.chart .coll.now { fill: var(--brass-bright); }

/* ---------- Queue ---------- */
.queue { display: flex; flex-direction: column; }
.qi { display: flex; gap: 12px; align-items: center; padding: 12px 20px; border-bottom: 1px solid var(--line-2); text-align: left; background: none; border-left: none; border-right: none; border-top: none; width: 100%; }
.qi:last-child { border-bottom: none; }
.qi:hover { background: var(--surface-2); }
.qi .ic { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; flex: none; }
.qi .tx { flex: 1; min-width: 0; }
.qi .tx b { display: block; font-size: 13.5px; font-weight: 600; }
.qi .tx span { font-size: 12px; color: var(--muted); }

/* ---------- Modal & drawer ---------- */
.scrim { position: fixed; inset: 0; background: rgba(12,18,16,.48); backdrop-filter: blur(3px); z-index: 50; display: flex; align-items: center; justify-content: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); animation: fade .15s ease-out; }
.modal { background: var(--surface); border-radius: 20px; width: min(560px, 100%); max-height: 100%; display: flex; flex-direction: column; box-shadow: var(--shadow-lg); border: 1px solid var(--line); animation: rise .2s ease-out; }
.modal.wide { width: min(780px, 100%); }
.modal-head { padding: 20px 24px 14px; display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.modal-head h2 { font-size: 22px; }
.modal-head p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
.modal-body { padding: 4px 24px 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
.modal-foot { padding: 14px 24px; border-top: 1px solid var(--line-2); display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; background: var(--surface-2); border-radius: 0 0 20px 20px; }
.drawer-scrim { justify-content: flex-end; align-items: stretch; padding: 0; }

/* =============================== Derived =============================== */
function rateFor(fl, settings) { return fl.occupancy === 'tenant' ? Math.round(settings.baseRate * settings.tenantMultiplier) : settings.baseRate; }
function flatSummary(db, flatId) {
  const rows = db.ledger.filter((r) => r.flat === flatId);
  const charged = rows.filter((r) => r.type === 'SYSTEM').reduce((s, r) => s + r.amount, 0);
  const paid = rows.filter((r) => r.type === 'DEPOSIT' && r.status === 'approved').reduce((s, r) => s + r.amount, 0);
  const credit = rows.filter((r) => r.type === 'CREDIT' && r.status === 'approved').reduce((s, r) => s + r.amount, 0);
  const outstanding = Math.max(0, charged - paid);
  const advance = Math.max(0, paid - charged);
  const creditBal = credit + advance;
  const payable = Math.max(0, outstanding - creditBal);
  const pending = rows.filter((r) => r.status === 'pending').length;
  const fl = db.flats.find((f) => f.id === flatId);
  const rate = fl ? rateFor(fl, db.settings) : 3000;
  const status = pending ? 'pending' : payable >= rate * 2 ? 'overdue' : payable > 0 ? 'due' : 'settled';
  return { outstanding, credit: creditBal, payable, pending, status, rate };
}

function TrendChart({ db }) {
  const billedNov = db.ledger.filter((r) => r.type === 'SYSTEM' && r.period === '2026-11').reduce((s, r) => s + r.amount, 0);
  const collected = (p) => db.ledger.filter((r) => r.type === 'DEPOSIT' && r.status === 'approved' && r.period === p).reduce((s, r) => s + r.amount, 0);
  const data = [
    { m: 'Jun', b: 78000, c: 78000 }, { m: 'Jul', b: 78000, c: 76500 },
    { m: 'Aug', b: 78000, c: collected('2026-08') }, { m: 'Sep', b: 78000, c: collected('2026-09') },
    { m: 'Oct', b: 78000, c: collected('2026-10') + db.ledger.filter((r) => r.type === 'DEPOSIT' && r.status === 'approved' && !r.period && r.date >= '2026-11-01').reduce((s, r) => s + r.amount, 0) },
    { m: 'Nov', b: billedNov, c: 0, now: true },
  ];
  const W = 520, H = 190, padL = 40, padB = 24, top = 10, max = 90000;
  const y = (v) => top + (H - padB - top) * (1 - v / max);
  const bw = (W - padL) / data.length;
  return html`<svg className="chart" viewBox=${`0 0 ${W} ${H}`} width="100%" role="img" aria-label="Billed versus collected by month">
    ${[0, 30000, 60000, 90000].map((v) => html`<g key=${v}><line className="grid" x1=${padL} x2=${W} y1=${y(v)} y2=${y(v)} /><text x=${padL - 6} y=${y(v) + 3} textAnchor="end">${v ? v / 1000 + 'k' : '0'}</text></g>`)}
    ${data.map((d, i) => { const x = padL + i * bw + bw * 0.2; const w = bw * 0.6; return html`<g key=${d.m}>
      ${d.b > 0 && html`<rect className="billed" x=${x} y=${y(d.b)} width=${w} height=${y(0) - y(d.b)} rx="4" />`}
      ${d.c > 0 && html`<rect className=${'coll' + (d.now ? ' now' : '')} x=${x + w * 0.18} y=${y(d.c)} width=${w * 0.64} height=${y(0) - y(d.c)} rx="3" />`}
      <text x=${x + w / 2} y=${H - 6} textAnchor="middle">${d.m}</text>
      ${d.b > 0 && html`<text x=${x + w / 2} y=${y(Math.max(d.b, d.c)) - 5} textAnchor="middle" style=${{ fill: 'var(--ink-2)' }}>${Math.round((d.c / d.b) * 100)}%</text>`}
      ${d.now && d.b === 0 && html`<text x=${x + w / 2} y=${y(0) - 8} textAnchor="middle">not billed</text>`}
    </g>`; })}
  </svg>`;
}

function FlatDrawer({ db, flatId, onClose, update, toast, isNew }) {
  const orig = isNew ? { id: '', wing: 'A', number: '', owner: { name: '', email: '', phone: '' }, occupancy: 'owner', tenant: null, history: [] } : db.flats.find((f) => f.id === flatId);
  const [tab, setTab] = useState(isNew ? 'details' : 'ledger');
  const [f, setF] = useState(() => JSON.parse(JSON.stringify(orig)));
  const sum = isNew ? null : flatSummary(db, flatId);
  const rows = isNew ? [] : db.ledger.filter((r) => r.flat === flatId).sort((a, b) => b.date.localeCompare(a.date) || (a.type === 'SYSTEM' ? 1 : -1));
  const setO = (k, v) => setF({ ...f, owner: { ...f.owner, [k]: v } });
  const save = () => {
    if (!f.number || !f.owner.name) { toast('Flat number and owner name are required'); return; }
    const newId = f.wing + '-' + f.number;
    update((d) => {
      if (isNew) d.flats.push({ ...f, id: newId, floor: +String(f.number)[0] || 0, unit: 0, lastLogin: null, history: [{ date: TODAY, text: 'Flat onboarded by admin' }] });
      else { const i = d.flats.findIndex((x) => x.id === flatId); d.flats[i] = { ...d.flats[i], wing: f.wing, number: f.number, owner: f.owner }; }
    });
    toast(isNew ? `Flat ${newId} added` : `Saved changes to ${flatId}`); onClose();
  };
  const rate = rateFor(f, db.settings);
  return html`<${Drawer} title=${isNew ? 'Onboard a flat' : 'Flat ' + flatId} sub=${isNew ? 'Owner details now; tenant details are added by the resident' : (f.occupancy === 'tenant' ? 'Tenant-occupied' : 'Owner-occupied') + ' · ' + inr(rate) + ' per month'} onClose=${onClose}
    foot=${tab === 'details' ? html`<button className="btn" onClick=${onClose}>Cancel</button><button className="btn primary" onClick=${save}>${isNew ? 'Add flat' : 'Save changes'}</button>` : html`<button className="btn" onClick=${() => setTab('details')}><${Icon} n="edit" s=${15} />Edit details</button>`}>
    ${!isNew && html`<div className="grid3">
      <div className="metric" style=${{ padding: 14 }}><span className="eyebrow">Outstanding</span><span className="val num" style=${{ fontSize: 20, fontFamily: 'var(--mono)' }}>${inr(sum.outstanding)}</span></div>
      <div className="metric" style=${{ padding: 14 }}><span className="eyebrow">Credit</span><span className="val num" style=${{ fontSize: 20, fontFamily: 'var(--mono)', color: 'var(--brass)' }}>${inr(sum.credit)}</span></div>
      <div className="metric hero" style=${{ padding: 14 }}><span className="eyebrow">Payable</span><span className="val num" style=${{ fontSize: 20, fontFamily: 'var(--mono)' }}>${inr(sum.payable)}</span></div></div>
    <div className="chips">${[['ledger', 'Passbook'], ['details', 'Details'], ['history', 'Occupancy history']].map(([k, l]) => html`<button key=${k} className=${'chip' + (tab === k ? ' on' : '')} onClick=${() => setTab(k)}>${l}</button>`)}</div>`}
    ${tab === 'ledger' && html`<div className="card table-wrap"><table className="t"><thead><tr><th>Date</th><th>Payer</th><th>Type</th><th className="r">Amount</th><th>Status</th></tr></thead>
      <tbody>${rows.map((r) => html`<tr key=${r.id} className=${'tint-' + r.type}><td className="num" style=${{ fontSize: 12.5, whiteSpace: 'nowrap' }}>${shortDate(r.date)}</td><td style=${{ fontSize: 13 }}>${r.payer}${r.type !== 'SYSTEM' && html`<small style=${{ display: 'block', color: 'var(--muted)', fontSize: 11.5 }}>${r.note}</small>`}</td><td><span className=${'tag ' + r.type}>${r.type}</span></td><td className="r num">${r.type === 'SYSTEM' ? '' : '−'}${inr(r.amount)}</td><td>${r.type === 'SYSTEM' ? html`<span className="muted" style=${{ fontSize: 12 }}>Auto</span>` : html`<span className=${'pill ' + r.status}>${r.status[0].toUpperCase() + r.status.slice(1)}</span>`}</td></tr>`)}</tbody></table></div>`}

      <div className="eyebrow">Flat</div>

/* =============================== Admin: Billing =============================== */
function Billing({ db, update, toast }) {
  const s = db.settings;
  const [base, setBase] = useState(s.baseRate);
  const [mult, setMult] = useState(s.tenantMultiplier);
  const [confirm, setConfirm] = useState(false);
  const dirty = +base !== s.baseRate || +mult !== s.tenantMultiplier;
  const novRun = db.runs.find((r) => r.period === '2026-11');
  const preview = db.flats.reduce((t, f) => t + rateFor(f, s), 0);
  const tenants = db.flats.filter((f) => f.occupancy === 'tenant').length;
  const saveRates = () => { update((d) => { d.settings.baseRate = +base; d.settings.tenantMultiplier = +mult; }); toast('Rates saved. They apply from the next billing run.'); };
  const generate = () => {
    update((d) => {
      d.flats.forEach((fl) => { if (!d.ledger.some((r) => r.flat === fl.id && r.type === 'SYSTEM' && r.period === '2026-11')) d.ledger.push({ id: uid('sys'), flat: fl.id, date: TODAY, type: 'SYSTEM', amount: rateFor(fl, d.settings), status: 'approved', payer: 'System', period: '2026-11', note: 'Maintenance · Nov 2026' }); });
      d.runs.push({ period: '2026-11', date: TODAY, flats: d.flats.length, total: d.flats.reduce((t, fl) => t + rateFor(fl, d.settings), 0), by: 'Sanjay Gujarathi' });
      d.messages.unshift({ id: uid('M'), at: '2026-11-03 10:15', to: `All residents (${d.flats.length})`, template: 'monthly_bill', status: 'sent', count: d.flats.length });
      d.credits -= d.flats.length;
    });
    setConfirm(false); toast(`November charges generated for ${db.flats.length} flats. Bill reminders queued on WhatsApp.`);
  };
  return html`<${Fragment}>
    <${PageHead} eyebrow="Billing" title="Maintenance billing" sub="Set the monthly rate once. Each month the system adds a charge to every flat’s passbook using the rate in force on that day." />
    <div className="split">
      <div className="card">
        <div className="card-head"><div><h2>November 2026 run</h2><span className="muted" style=${{ fontSize: 12.5 }}>Scheduled for the 1st of each month</span></div>${novRun ? html`<span className="pill settled">Generated</span>` : html`<span className="pill pending">Due now</span>`}</div>
        <div className="card-pad" style=${{ display: 'flex', flexDirection: 'column', gap: 16 }}>
          <dl className="kv-list" style=${{ margin: 0 }}>
            <dt>Flats</dt><dd className="num">${db.flats.length}</dd>
            <dt>Owner-occupied × ${inr(s.baseRate)}</dt><dd className="num">${db.flats.length - tenants}</dd>
            <dt>Tenant-occupied × ${inr(rateFor({ occupancy: 'tenant' }, s))}</dt><dd className="num">${tenants}</dd>
            <dt style=${{ color: 'var(--ink)', fontWeight: 600 }}>Total to be charged</dt><dd className="num" style=${{ fontSize: 18 }}>${inr(novRun ? novRun.total : preview)}</dd>
          </dl>
          ${novRun ? html`<div className="stage-note"><${Icon} n="check" s=${16} style=${{ color: 'var(--teal)' }} />Generated on ${fmtDate(novRun.date)} by ${novRun.by}. Running it again won’t create duplicates.</div>`
            : confirm ? html`<div style=${{ display: 'flex', gap: 8, alignItems: 'center', flexWrap: 'wrap', background: 'var(--brass-soft)', padding: 12, borderRadius: 12 }}><span style=${{ flex: 1, minWidth: 200, fontSize: 13 }}>Add ${inr(preview)} across ${db.flats.length} passbooks and send bill reminders?</span><button className="btn sm" onClick=${() => setConfirm(false)}>Cancel</button><button className="btn sm primary" onClick=${generate}>Generate charges</button></div>`
            : html`<button className="btn primary" onClick=${() => setConfirm(true)} style=${{ alignSelf: 'flex-start' }}><${Icon} n="zap" s=${16} />Generate November charges</button>`}
        </div>
      </div>
      <div className="card">
        <div className="card-head"><h2>Rates</h2>${dirty && html`<span className="pill pending">Unsaved</span>`}</div>
        <div className="card-pad" style=${{ display: 'flex', flexDirection: 'column', gap: 14 }}>
          <${Field} label="Base rate per flat / month"><input id="bill-base" className="input num" type="number" min="0" step="100" value=${base} onInput=${(e) => setBase(e.target.value)} /><//>
          <${Field} label="Tenant multiplier"><input id="bill-mult" className="input num" type="number" min="1" step="0.05" value=${mult} onInput=${(e) => setMult(e.target.value)} /><//>
          <div style=${{ background: 'var(--surface-2)', border: '1px solid var(--line-2)', borderRadius: 12, padding: 12, fontSize: 13 }}>
            <div style=${{ display: 'flex', justifyContent: 'space-between' }}><span className="muted">Owner-occupied</span><b className="num">${inr(+base || 0)}</b></div>
            <div style=${{ display: 'flex', justifyContent: 'space-between', marginTop: 6 }}><span className="muted">Tenant-occupied</span><b className="num">${inr(Math.round((+base || 0) * (+mult || 1)))}</b></div></div>
          <button className="btn primary" disabled=${!dirty} onClick=${saveRates}>Save rates</button>
          <p className="muted" style=${{ fontSize: 12, margin: 0 }}>Past charges and receipts keep the amount they were created with.</p>
        </div>
      </div>
    </div>
    <div className="card">
      <div className="card-head"><h2>Billing runs</h2></div>
      <div className="table-wrap"><table className="t"><thead><tr><th>Period</th><th>Run on</th><th className="r">Flats</th><th className="r">Total charged</th><th>Triggered by</th></tr></thead>
        <tbody>${[...db.runs].reverse().map((r) => html`<tr key=${r.period}><td style=${{ fontWeight: 600 }}>${periodLabel(r.period)}</td><td className="muted">${fmtDate(r.date)}</td><td className="r num">${r.flats}</td><td className="r num">${inr(r.total)}</td><td>${r.by}</td></tr>`)}</tbody></table></div>
    </div>
  <//>`;
}

function Review({ db, update, toast, openReceipt }) {
  const pending = db.ledger.filter((r) => r.status === 'pending').sort((a, b) => a.date.localeCompare(b.date));
  const reviewed = db.ledger.filter((r) => r.type !== 'SYSTEM' && r.status !== 'pending' && r.reviewedOn).sort((a, b) => b.reviewedOn.localeCompare(a.reviewedOn));
  const [sel, setSel] = useState(pending[0] ? pending[0].id : null);
  const [rejecting, setRejecting] = useState(false);
  const [reason, setReason] = useState('');
  const [approve, setApprove] = useState(null);
  const [manual, setManual] = useState(false);
  const cur = pending.find((p) => p.id === sel) || pending[0];
  useEffect(() => { setRejecting(false); setReason(''); }, [sel]);
  const fl = cur && db.flats.find((f) => f.id === cur.flat);
  const sum = cur && flatSummary(db, cur.flat);
  const draftReceipt = (e) => ({ no: db.settings.receiptPrefix + String(db.nextReceipt).padStart(4, '0'), entryId: e.id, flat: e.flat, date: TODAY, amount: e.amount, payer: e.payer, mode: e.mode, ref: e.ref, kind: e.type,
    particulars: e.type === 'CREDIT' ? [{ label: 'Credit · ' + e.note, amount: e.amount }] : [{ label: 'Maintenance charges · ' + e.note.replace(/^Maintenance[\s·]*/i, ''), amount: e.amount }] });
  const confirmApprove = () => {
    const r = approve; const isManual = !!r.manual;
    update((d) => {
      if (isManual) d.ledger.push({ ...r.entry, status: 'approved', receiptNo: r.receipt.no, reviewedOn: TODAY });
      else { const e = d.ledger.find((x) => x.id === r.entry.id); e.status = 'approved'; e.receiptNo = r.receipt.no; e.reviewedOn = TODAY; }
      d.receipts.push(r.receipt); d.nextReceipt += 1;
      if (d.settings.autoReceipt) { d.messages.unshift({ id: uid('M'), at: '2026-11-03 10:20', to: `${r.entry.payer} · ${r.entry.flat}`, template: 'payment_received', status: 'sent' }); d.credits -= 1; }
    });
    toast(`Approved. Receipt ${r.receipt.no} sent to ${r.entry.payer}.`);
    setApprove(null); setSel(null);
  };
  const reject = () => {
    if (!reason.trim()) return;
    update((d) => { const e = d.ledger.find((x) => x.id === cur.id); e.status = 'rejected'; e.rejectReason = reason.trim(); e.reviewedOn = TODAY;
      d.messages.unshift({ id: uid('M'), at: '2026-11-03 10:22', to: `${cur.payer} · ${cur.flat}`, template: 'payment_rejected', status: 'sent' }); d.credits -= 1; });
    toast(`Rejected. ${cur.payer} has been told why.`); setSel(null);
  };
  return html`<${Fragment}>
    <${PageHead} eyebrow="Collections" title="Payment review" sub="Residents upload a payment screenshot or a credit claim. Nothing counts toward a flat’s balance until you approve it.">
      <button className="btn" onClick=${() => setManual(true)}><${Icon} n="cash" s=${16} />Record cash or cheque</button>
    <//>
    ${pending.length ? html`<div className="split" style=${{ gridTemplateColumns: 'minmax(0, 300px) minmax(0, 1fr)' }}>
      <div className="card"><div className="card-head"><h2>Waiting</h2><span className="pill pending">${pending.length}</span></div>
        <div className="queue">${pending.map((p) => html`<button key=${p.id} className="qi" style=${cur && cur.id === p.id ? { background: 'var(--surface-2)', boxShadow: 'inset 3px 0 0 var(--brass-bright)' } : null} onClick=${() => setSel(p.id)}>
          <span className="tx"><b><span className="flatno">${p.flat}</span> · ${p.payer}</b><span><span className=${'tag ' + p.type} style=${{ marginRight: 6 }}>${p.type}</span>${shortDate(p.date)}</span></span><b className="num">${inr(p.amount)}</b></button>`)}</div></div>
      ${cur && html`<div className="card">
        <div className="card-head"><div><h2>${cur.type === 'CREDIT' ? 'Credit claim' : 'Payment proof'} · ${cur.flat}</h2><span className="muted" style=${{ fontSize: 12.5 }}>Submitted ${cur.submittedAt} by ${cur.payer}</span></div><span className=${'tag ' + cur.type}>${cur.type}</span></div>
        <div className="card-pad" style=${{ display: 'flex', gap: 24, flexWrap: 'wrap' }}>
          <${ProofShot} e=${cur} />
          <div style=${{ flex: 1, minWidth: 240, display: 'flex', flexDirection: 'column', gap: 16 }}>
            <dl className="kv-list" style=${{ margin: 0 }}>
              <dt>Amount claimed</dt><dd className="num" style=${{ fontSize: 18 }}>${inr(cur.amount)}</dd>
              <dt>${cur.type === 'CREDIT' ? 'Bill reference' : 'UPI reference'}</dt><dd className="num">${cur.ref}</dd>
              <dt>Note from resident</dt><dd>${cur.note}</dd>
              <dt>Paid by</dt><dd>${cur.payer} (${fl.occupancy === 'tenant' && fl.tenant.name === cur.payer ? 'tenant' : 'owner'})</dd>
            </dl>
            <div style=${{ background: 'var(--surface-2)', borderRadius: 12, padding: 12, fontSize: 13, border: '1px solid var(--line-2)' }}>
              <div className="eyebrow" style=${{ marginBottom: 8 }}>Flat ${cur.flat} right now</div>
              <div style=${{ display: 'flex', justifyContent: 'space-between' }}><span className="muted">Payable before approval</span><b className="num">${inr(sum.payable)}</b></div>
              <div style=${{ display: 'flex', justifyContent: 'space-between', marginTop: 4 }}><span className="muted">Payable after approval</span><b className="num" style=${{ color: 'var(--teal)' }}>${inr(Math.max(0, sum.payable - cur.amount))}</b></div>
              ${cur.amount > sum.payable && html`<div className="muted" style=${{ fontSize: 12, marginTop: 6 }}>${inr(cur.amount - sum.payable)} will carry forward as credit.</div>`}
            </div>
            ${rejecting ? html`<div style=${{ display: 'flex', flexDirection: 'column', gap: 10 }}>
              <${Field} label="Reason the resident will see"><textarea id="rej-reason" className="input" placeholder="For example: UTR not visible, amount doesn’t match the bank credit" value=${reason} onInput=${(e) => setReason(e.target.value)}></textarea><//>
              <div className="actions"><button className="btn" onClick=${() => setRejecting(false)}>Back</button><button className="btn danger" disabled=${!reason.trim()} onClick=${reject}>Reject and notify</button></div></div>`
            : html`<div className="actions"><button className="btn danger" onClick=${() => setRejecting(true)}><${Icon} n="x" s=${16} />Reject</button><button className="btn primary" onClick=${() => setApprove({ entry: cur, receipt: draftReceipt(cur) })}><${Icon} n="check" s=${16} />Approve</button></div>`}
          </div>
        </div>
      </div>`}
    </div>` : html`<div className="card"><div className="empty"><span style=${{ color: 'var(--teal)' }}><${Icon} n="check" s=${30} /></span><b style=${{ color: 'var(--ink)', fontSize: 16 }}>All caught up</b>No payments or credit claims are waiting for review.</div></div>`}
    ${reviewed.length > 0 && html`<div className="card"><div className="card-head"><h2>Reviewed today</h2></div><div className="table-wrap"><table className="t"><thead><tr><th>Flat</th><th>Payer</th><th>Type</th><th className="r">Amount</th><th>Result</th><th>Receipt</th></tr></thead>
      <tbody>${reviewed.map((r) => html`<tr key=${r.id}><td className="flatno">${r.flat}</td><td>${r.payer}</td><td><span className=${'tag ' + r.type}>${r.type}</span></td><td className="r num">${inr(r.amount)}</td><td><span className=${'pill ' + r.status}>${r.status === 'approved' ? 'Approved' : 'Rejected'}</span></td><td>${r.receiptNo ? html`<button className="btn sm ghost" onClick=${() => openReceipt(r.receiptNo)}><${Icon} n="receipt" s=${14} />${r.receiptNo}</button>` : html`<span className="muted" style=${{ fontSize: 12.5 }}>${r.rejectReason}</span>`}</td></tr>`)}</tbody></table></div></div>`}
    ${approve && html`<${Modal} wide title="Check the receipt before approving" sub="This receipt is issued and sent to the resident once you confirm. Receipt numbers are sequential and can’t be reused." onClose=${() => setApprove(null)}
      foot=${html`<button className="btn" onClick=${() => setApprove(null)}>Cancel</button><button className="btn primary" onClick=${confirmApprove}><${Icon} n="check" s=${16} />Confirm & approve</button>`}>
      <${Receipt} r=${approve.receipt} db=${db} />
    <//>`}
    ${manual && html`<${ManualPayment} db=${db} onClose=${() => setManual(false)} onNext=${(entry) => { setManual(false); setApprove({ manual: true, entry, receipt: draftReceipt(entry) }); }} />`}
  <//>`;
}
function ManualPayment({ db, onClose, onNext }) {
  const [flat, setFlat] = useState('A-602');

  return html`<${Modal} title="Record a cash or cheque payment" sub="For residents who pay at the society office. A receipt is issued straight away." onClose=${onClose}
    foot=${html`<button className="btn" onClick=${onClose}>Cancel</button><button className="btn primary" disabled=${!(+amount > 0) || (mode === 'Cheque' && !ref.trim())} onClick=${() => onNext({ id: uid('dep'), flat, date: TODAY, type: 'DEPOSIT', amount: +amount, payer: name, mode, ref: mode === 'Cash' ? 'Paid at office' : (mode === 'Cheque' ? 'Chq ' : 'Ref ') + ref, note: 'Maintenance (recorded by admin)', manual: true })}>Preview receipt</button>`}>
    <div className="grid2">
      <${Field} label="Flat"><select id="mp-flat" className="input" value=${flat} onChange=${(e) => setFlat(e.target.value)}>${db.flats.map((f) => html`<option key=${f.id} value=${f.id}>${f.id} · ${f.owner.name}</option>`)}</select><//>
      <${Field} label="Paid by"><select id="mp-payer" className="input" value=${payer} onChange=${(e) => setPayer(e.target.value)}><option value="owner">${fl.owner.name} (owner)</option>${fl.tenant && html`<option value="tenant">${fl.tenant.name} (tenant)</option>`}</select><//>
    </div>
    <div className="grid2">

}

/* =============================== Admin: Complaints =============================== */
const PRIO = { high: 'var(--coral)', medium: 'var(--brass-bright)', low: 'var(--line)' };
function Complaints({ db, update, toast }) {
  const [open, setOpen] = useState(null);
  const [note, setNote] = useState('');
  const [assignee, setAssignee] = useState('');
  const c = open && db.complaints.find((x) => x.id === open);
  const move = (status) => {
    update((d) => { const x = d.complaints.find((y) => y.id === open); x.status = status; if (assignee) x.assignee = assignee; if (note.trim()) x.notes.push(note.trim()); if (status === 'resolved') x.resolvedOn = TODAY;
      d.messages.unshift({ id: uid('M'), at: '2026-11-03 10:30', to: `${x.by} · ${x.flat}`, template: status === 'resolved' ? 'complaint_resolved' : 'complaint_update', status: 'sent' }); d.credits -= 1; });
    toast(status === 'resolved' ? `${open} marked resolved. ${c.by} has been notified.` : `${open} moved to In progress`); setOpen(null); setNote(''); setAssignee('');
  };
  const cols = [['open', 'Open'], ['progress', 'In progress'], ['resolved', 'Resolved']];
  return html`<${Fragment}>
    <${PageHead} eyebrow="Operations" title="Complaints" sub="Raised by residents from the app. Each update reaches the resident on WhatsApp." />
    <div className="board">${cols.map(([k, l]) => { const items = db.complaints.filter((x) => x.status === k); return html`<div key=${k} className="col">
      <div className="col-head"><b>${l}</b><span className=${'pill ' + k}>${items.length}</span></div>
      ${items.map((x) => html`<button key=${x.id} className="ticket" onClick=${() => { setOpen(x.id); setAssignee(x.assignee || ''); }}>
        <div style=${{ display: 'flex', gap: 10 }}><span className="sev" style=${{ background: PRIO[x.priority] }}></span><div style=${{ minWidth: 0 }}><b style=${{ fontSize: 13.5, fontWeight: 600 }}>${x.title}</b>
        <div className="meta" style=${{ marginTop: 6 }}><span className="num">${x.id}</span><span>·</span><span className="flatno" style=${{ fontSize: 11.5 }}>${x.flat}</span><span>·</span><span>${x.category}</span></div></div></div>
        <div className="meta" style=${{ justifyContent: 'space-between' }}><span>${x.by}</span><span>${x.status === 'resolved' ? 'Closed ' + shortDate(x.resolvedOn) : daysBetween(x.date, TODAY) + ' days open'}</span></div>
      </button>`)}</div>`; })}</div>
    ${c && html`<${Modal} title=${c.title} sub=${`${c.id} · ${c.flat} · raised by ${c.by} on ${fmtDate(c.date)}`} onClose=${() => setOpen(null)}
      foot=${c.status === 'resolved' ? html`<button className="btn" onClick=${() => setOpen(null)}>Close</button>` : html`<button className="btn" onClick=${() => setOpen(null)}>Cancel</button>${c.status === 'open' && html`<button className="btn" onClick=${() => move('progress')}>Start work</button>`}<button className="btn primary" onClick=${() => move('resolved')}><${Icon} n="check" s=${16} />Mark resolved</button>`}>
      <div style=${{ display: 'flex', gap: 8, flexWrap: 'wrap' }}><span className=${'pill ' + c.status}>${cols.find((x) => x[0] === c.status)[1]}</span><span className="tag">${c.category.toUpperCase()}</span><span className="tag" style=${{ color: PRIO[c.priority] === 'var(--line)' ? 'var(--muted)' : PRIO[c.priority] }}>${c.priority.toUpperCase()} PRIORITY</span></div>
      ${c.notes.length > 0 && html`<div style=${{ display: 'flex', flexDirection: 'column', gap: 8 }}>${c.notes.map((n, i) => html`<div key=${i} style=${{ background: 'var(--surface-2)', borderRadius: 10, padding: '9px 12px', fontSize: 13, border: '1px solid var(--line-2)' }}>${n}</div>`)}</div>`}
      ${c.status !== 'resolved' && html`<${Fragment}><${Field} label="Assigned to"><input id="cp-assign" className="input" placeholder="Vendor or committee member" value=${assignee} onInput=${(e) => setAssignee(e.target.value)} /><//>
      <${Field} label="Update for the resident"><textarea id="cp-note" className="input" placeholder="What happens next" value=${note} onInput=${(e) => setNote(e.target.value)}></textarea><//><//>`}
    <//>`}
  <//>`;
}

function unpaidPeriods(db, flatId) {
  const rows = db.ledger.filter((r) => r.flat === flatId);
  let cover = rows.filter((r) => (r.type === 'DEPOSIT' || r.type === 'CREDIT') && r.status === 'approved').reduce((s, r) => s + r.amount, 0);

}

function FilePick({ id, img, onPick, onSample, label }) {
  const onFile = (e) => { const f = e.target.files && e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => onPick(r.result); r.readAsDataURL(f); };
  return html`<div className="upload">${img ? html`<img src=${img} alt="Selected file" />` : html`<span style=${{ color: 'var(--teal)' }}><${Icon} n="upload" s=${24} /></span><span>${label}</span>`}

function QR({ code }) {
  const N = 25; let h = 0; for (const c of code) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  const rnd = () => { h ^= h << 13; h >>>= 0; h ^= h >>> 17; h ^= h << 5; h >>>= 0; return h / 4294967296; };
  const cells = [];
  const finder = (x, y) => (x < 7 && y < 7) || (x >= N - 7 && y < 7) || (x < 7 && y >= N - 7);
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if (!finder(x, y) && rnd() > 0.52) cells.push(html`<rect key=${x + '-' + y} x=${x} y=${y} width="1" height="1" />`);
  const F = (x, y) => html`<g key=${'f' + x + y}><rect x=${x} y=${y} width="7" height="7" fill="#111" /><rect x=${x + 1} y=${y + 1} width="5" height="5" fill="#fff" /><rect x=${x + 2} y=${y + 2} width="3" height="3" fill="#111" /></g>`;
  return html`<svg className="qr" viewBox=${`0 0 ${N} ${N}`} shapeRendering="crispEdges" role="img" aria-label=${'QR code for pass ' + code}><rect width=${N} height=${N} fill="#fff" /><g fill="#111">${cells}</g>${F(0, 0)}${F(N - 7, 0)}${F(0, N - 7)}</svg>`;
}

  else body = html`<${Fragment}>

/* =============================== Guard app (Stage 3) =============================== */
const nowTime = () => { const d = new Date(); let h = d.getHours(); const m = String(d.getMinutes()).padStart(2, '0'); const ap = h >= 12 ? 'pm' : 'am'; h = h % 12 || 12; return `${h}:${m} ${ap}`; };
const VIS_TYPES = { Guest: 'user', Delivery: 'inbox', Cab: 'arrow', Service: 'wrench', Staff: 'building' };
const PHOTO_TONES = ['#2F6E64', '#35577D', '#B8863A', '#8A5A44', '#5B6B3A'];
const samplePhoto = (name) => {
  const c = PHOTO_TONES[name.length % PHOTO_TONES.length];
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120"><rect width="120" height="120" fill="${c}"/><circle cx="60" cy="48" r="22" fill="#F1E3CF"/><path d="M20 120c4-26 20-38 40-38s36 12 40 38z" fill="#F1E3CF"/><rect x="0" y="100" width="120" height="20" fill="rgba(0,0,0,.35)"/><text x="60" y="114" text-anchor="middle" font-family="monospace" font-size="10" fill="#fff">GATE CAM · ${new Date().toTimeString().slice(0, 5)}</text></svg>`;
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
};
function VPhoto({ v, size = 40 }) {
  return v.photo ? html`<img src=${v.photo} alt="" style=${{ width: size, height: size, borderRadius: 12, objectFit: 'cover', flex: 'none' }} />`
    : html`<span style=${{ width: size, height: size, borderRadius: 12, display: 'grid', placeItems: 'center', background: 'var(--blue-soft)', color: 'var(--blue)', flex: 'none' }}><${Icon} n=${VIS_TYPES[v.type] || 'user'} s=${18} /></span>`;
}
const VSTATUS = { inside: ['approved', 'Inside'], out: ['sent', 'Left'], waiting: ['pending', 'Waiting'], denied: ['rejected', 'Turned away'] };
function residentsOf(fl) { return fl.tenant ? [fl.tenant.name + ' (tenant)', fl.owner.name + ' (owner)'] : [fl.owner.name]; }

const StatusBar = html`<div className="statusbar"><span>9:41</span><span className="cam"></span><span style=${{ display: 'flex', gap: 4, alignItems: 'center' }}>5G <svg width="22" height="11" viewBox="0 0 22 11" aria-hidden="true"><rect x=".5" y=".5" width="18" height="10" rx="2.5" fill="none" stroke="currentColor" opacity=".5"/><rect x="2" y="2" width="13" height="7" rx="1.3" fill="currentColor"/><rect x="19.5" y="3.5" width="2" height="4" rx="1" fill="currentColor" opacity=".5"/></svg></span></div>`;

function WalkInSheet({ db, update, toast, onClose }) {
  const [type, setType] = useState('Delivery'); const [name, setName] = useState(''); const [phone, setPhone] = useState(''); const [flat, setFlat] = useState('A-302'); const [purpose, setPurpose] = useState(''); const [vehicle, setVehicle] = useState(''); const [photo, setPhoto] = useState(null);
  const fl = db.flats.find((f) => f.id === flat);
  const submit = () => {
    update((d) => d.visitors.unshift({ id: uid('V'), name: name.trim(), phone: phone.trim(), type, flat, purpose: purpose.trim() || type, vehicle: vehicle.trim(), photo, status: 'waiting', requestedAt: nowTime(), via: 'Walk-in' }));
    toast(`Approval request sent to ${fl.id}. They can allow it from the app.`); onClose();
  };
  return html`<${Sheet} title="Walk-in visitor" sub="No gate pass? Ask the flat to approve from their app." onClose=${onClose}
    foot=${html`<button className="btn" onClick=${onClose}>Cancel</button><button className="btn primary" disabled=${!name.trim() || !photo} onClick=${submit}>Ask ${flat} to approve</button>`}>
    <div className="seg">${['Guest', 'Delivery', 'Cab', 'Service'].map((t) => html`<button key=${t} className=${type === t ? 'on' : ''} onClick=${() => setType(t)}>${t}</button>`)}</div>
    <${Field} label="Visitor photo"><${FilePick} id="wi-photo" img=${photo} onPick=${setPhoto} onSample=${() => setPhoto(samplePhoto(name || 'Visitor'))} label="Take a photo at the gate" /><//>
    <${Field} label=${type === 'Delivery' ? 'Name and company' : 'Name'}><input id="wi-name" className="input" placeholder=${type === 'Delivery' ? 'Ravi · Amazon' : 'Full name'} value=${name} onInput=${(e) => setName(e.target.value)} /><//>
    <div className="grid2" style=${{ gridTemplateColumns: 'repeat(2, minmax(0, 1fr))' }}>
      <${Field} label="Going to flat"><select id="wi-flat" className="input" value=${flat} onChange=${(e) => setFlat(e.target.value)}>${db.flats.map((f) => html`<option key=${f.id} value=${f.id}>${f.id}</option>`)}</select><//>
      <${Field} label="Phone" hint="Optional"><input id="wi-phone" className="input" inputMode="tel" value=${phone} onInput=${(e) => setPhone(e.target.value)} /><//></div>
    <div className="muted" style=${{ fontSize: 12 }}>${residentsOf(fl).join(' · ')}</div>
    <div className="grid2" style=${{ gridTemplateColumns: 'repeat(2, minmax(0, 1fr))' }}>
      <${Field} label="Purpose" hint="Optional"><input id="wi-purpose" className="input" placeholder="Parcel" value=${purpose} onInput=${(e) => setPurpose(e.target.value)} /><//>
      <${Field} label="Vehicle no." hint="Optional"><input id="wi-vehicle" className="input" placeholder="MH12 AB 1234" value=${vehicle} onInput=${(e) => setVehicle(e.target.value.toUpperCase())} /><//></div>
  <//>`;
}
function ScanSheet({ db, onClose, onScan }) {
  const today = db.gatePasses.filter((p) => p.status === 'active');
  return html`<${Sheet} title="Scan gate pass" sub="Point the camera at the visitor’s QR code." onClose=${onClose}>
    <div className="viewfinder"><span className="vf tl"></span><span className="vf tr"></span><span className="vf bl"></span><span className="vf br"></span><span className="scanline"></span><span style=${{ position: 'absolute', bottom: 12, left: 0, right: 0, textAlign: 'center', fontSize: 11.5, color: '#94A099' }}>Camera preview (simulated)</span></div>
    <div className="eyebrow">Demo: tap a pass to simulate scanning it</div>
    ${today.length ? html`<div className="list">${today.map((p) => html`<button key=${p.id} className="li" onClick=${() => onScan(p.code)}><${QR} code=${p.code} /><div className="tx"><b>${p.visitor}</b><span>${p.flat} · ${fmtDate(p.date)}</span></div><span className="num" style=${{ fontWeight: 600 }}>${p.code}</span></button>`)}</div>`
      : html`<div className="empty">No active passes. Create one as Priya or Arjun.</div>`}
  <//>`;
}

function GuardApp({ db, update, persona, onLogout, onReset, toast, onSwitch }) {
  const [tab, setTab] = useState('gate');
  const [sheet, setSheet] = useState(null);
  const [code, setCode] = useState('');
  const [result, setResult] = useState(null);
  const [logFilter, setLogFilter] = useState('all');
  const [q, setQ] = useState('');
  const bodyRef = useRef(null);
  useEffect(() => { if (bodyRef.current) bodyRef.current.scrollTop = 0; }, [tab]);
  const inside = db.visitors.filter((v) => v.status === 'inside');
  const waiting = db.visitors.filter((v) => v.status === 'waiting');
  const entries = db.visitors.filter((v) => v.status === 'inside' || v.status === 'out').length;
  const expected = db.gatePasses.filter((p) => p.status === 'active' && p.date === TODAY);
  const check = (c) => {
    const p = db.gatePasses.find((x) => x.code === c);
    if (!p) return setResult({ ok: false, msg: `No pass with code ${c}. Check the code, or make a walk-in entry.` });
    if (p.status === 'used') return setResult({ ok: false, p, msg: `Already used at ${p.usedAt}. A pass works once.` });
    if (p.status === 'cancelled') return setResult({ ok: false, p, msg: 'The resident cancelled this pass.' });
    if (p.date !== TODAY) return setResult({ ok: false, p, msg: `This pass is for ${fmtDate(p.date)}, not today.` });
    setResult({ ok: true, p });
  };
  const press = (k) => { setResult(null); const c = k === 'del' ? code.slice(0, -1) : k === 'clr' ? '' : (code + k).slice(0, 6); setCode(c); if (c.length === 6) check(c); };
  const allow = (p) => {
    const t = nowTime();
    update((d) => { const x = d.gatePasses.find((y) => y.id === p.id); x.status = 'used'; x.usedAt = t;
      d.visitors.unshift({ id: uid('V'), name: p.visitor, phone: p.phone, type: p.type, flat: p.flat, purpose: p.type, photo: null, status: 'inside', inAt: t, via: 'Gate pass ' + p.code }); });
    toast(`${p.visitor} let in. ${p.createdBy} has been notified.`); setCode(''); setResult(null);
  };
  const exit = (v) => { update((d) => { const x = d.visitors.find((y) => y.id === v.id); x.status = 'out'; x.outAt = nowTime(); }); toast(`${v.name} checked out`); };
  const decide = (v, okd) => { update((d) => { const x = d.visitors.find((y) => y.id === v.id); x.status = okd ? 'inside' : 'denied'; if (okd) x.inAt = nowTime(); x.via = okd ? 'Approved on call' : 'Turned away by guard'; }); toast(okd ? `${v.name} let in` : `${v.name} turned away`); };

  const VRow = (v, actions) => html`<div key=${v.id} className="li" style=${{ alignItems: 'flex-start' }}><${VPhoto} v=${v} />
    <div className="tx"><b>${v.name}</b><span>${v.type} · <span className="flatno" style=${{ fontSize: 11.5 }}>${v.flat}</span>${v.vehicle ? ' · ' + v.vehicle : ''}</span>
      <span>${v.status === 'waiting' ? 'Asked at ' + v.requestedAt : (v.inAt ? 'In ' + v.inAt : '') + (v.outAt ? ' · Out ' + v.outAt : '')} · ${v.via}</span>
      ${actions}</div>
    <span className=${'pill ' + VSTATUS[v.status][0]}>${VSTATUS[v.status][1]}</span></div>`;

  let body;
  if (tab === 'gate') body = html`<${Fragment}>
    <div className="g-stats"><div><b>${inside.length}</b><span>Inside now</span></div><div><b>${entries}</b><span>Entries today</span></div><div><b>${expected.length}</b><span>Passes due</span></div></div>
    <div className="big-act">
      <button className="primary" onClick=${() => setTab('verify')}><${Icon} n="shield" s=${26} />Verify pass<span>Code or QR</span></button>
      <button onClick=${() => setSheet({ kind: 'walkin' })}><${Icon} n="user" s=${26} />Walk-in<span>Ask the flat</span></button>
    </div>
    ${waiting.length > 0 && html`<${Fragment}><div className="sec-title"><b>Waiting for approval</b><span className="pill pending">${waiting.length}</span></div>
      <div className="list">${waiting.map((v) => VRow(v, html`<div style=${{ display: 'flex', gap: 6, marginTop: 8 }}><button className="btn sm danger" onClick=${() => decide(v, false)}>Turn away</button><button className="btn sm" onClick=${() => decide(v, true)}>Approved on call</button></div>`))}</div><//>`}
    <div className="sec-title"><b>Expected today</b><span className="muted" style=${{ fontSize: 12 }}>${expected.length} passes</span></div>
    ${expected.length ? html`<div className="list">${expected.map((p) => html`<button key=${p.id} className="li" onClick=${() => { setTab('verify'); setCode(p.code); check(p.code); }}><span style=${{ width: 40, height: 40, borderRadius: 12, display: 'grid', placeItems: 'center', background: 'var(--teal-soft)', color: 'var(--teal)', flex: 'none' }}><${Icon} n=${PASS_TYPES[p.type]} s=${18} /></span><div className="tx"><b>${p.visitor}</b><span>${p.flat} · ${p.window}</span></div><${Icon} n="chev" s=${15} /></button>`)}</div>`
      : html`<div className="empty" style=${{ padding: 20 }}>No passes due today.</div>`}
    <div className="sec-title"><b>Inside now</b><span className="muted" style=${{ fontSize: 12 }}>${inside.length}</span></div>
    ${inside.length ? html`<div className="list">${inside.map((v) => VRow(v, html`<div style=${{ marginTop: 8 }}><button className="btn sm" onClick=${() => exit(v)}><${Icon} n="logout" s=${14} />Mark exit</button></div>`))}</div>` : html`<div className="empty" style=${{ padding: 20 }}>Nobody inside.</div>`}
  <//>`;
  else if (tab === 'verify') body = html`<${Fragment}>
    <button className="btn primary" style=${{ padding: 14, fontSize: 15 }} onClick=${() => setSheet({ kind: 'scan' })}><${Icon} n="grid" s=${18} />Scan QR code</button>
    <div className="muted" style=${{ textAlign: 'center', fontSize: 12.5 }}>or type the 6-digit code</div>
    <div className="code-slots" aria-live="polite">${[0, 1, 2, 3, 4, 5].map((i) => html`<span key=${i} className=${code[i] ? 'f' : ''}>${code[i] || ''}</span>`)}</div>
    ${result && (result.ok ? html`<div className="verdict ok">
        <div style=${{ display: 'flex', gap: 10, alignItems: 'center' }}><span className="vbadge"><${Icon} n="check" s=${22} w=${2.4} /></span><div><b style=${{ fontSize: 16 }}>Valid pass</b><div style=${{ fontSize: 12.5 }}>${result.p.window}</div></div></div>
        <dl className="kv-list" style=${{ margin: 0 }}><dt>Visitor</dt><dd>${result.p.visitor}</dd><dt>Type</dt><dd>${result.p.type}</dd><dt>Flat</dt><dd className="flatno">${result.p.flat}</dd><dt>Created by</dt><dd>${result.p.createdBy}</dd>${result.p.phone && html`<dt>Phone</dt><dd className="num">${result.p.phone}</dd>`}</dl>
        <button className="btn primary" style=${{ padding: 13, fontSize: 15 }} onClick=${() => allow(result.p)}>Let in</button></div>`
      : html`<div className="verdict bad"><div style=${{ display: 'flex', gap: 10, alignItems: 'center' }}><span className="vbadge"><${Icon} n="x" s=${22} w=${2.4} /></span><div><b style=${{ fontSize: 16 }}>Don’t let in</b><div style=${{ fontSize: 12.5 }}>${result.msg}</div></div></div>
        ${result.p && html`<div style=${{ fontSize: 12.5 }}>${result.p.visitor} · ${result.p.flat}</div>`}
        <button className="btn" onClick=${() => { setCode(''); setResult(null); setSheet({ kind: 'walkin' }); }}>Make a walk-in entry instead</button></div>`)}
    <div className="keypad">${['1', '2', '3', '4', '5', '6', '7', '8', '9', 'clr', '0', 'del'].map((k) => html`<button key=${k} onClick=${() => press(k)} aria-label=${k === 'del' ? 'Delete' : k === 'clr' ? 'Clear' : k}>${k === 'del' ? html`<${Icon} n="arrow" s=${18} style=${{ transform: 'rotate(180deg)' }} />` : k === 'clr' ? html`<span style=${{ fontSize: 13, fontFamily: 'var(--body)', fontWeight: 600 }}>Clear</span>` : k}</button>`)}</div>
  <//>`;
  else if (tab === 'log') { const list = db.visitors.filter((v) => logFilter === 'all' || v.status === logFilter);
    body = html`<${Fragment}>
      <div className="chips">${[['all', 'All'], ['inside', 'Inside'], ['out', 'Left'], ['waiting', 'Waiting'], ['denied', 'Turned away']].map(([k, l]) => html`<button key=${k} className=${'chip' + (logFilter === k ? ' on' : '')} onClick=${() => setLogFilter(k)}>${l}<span className="c">${k === 'all' ? db.visitors.length : db.visitors.filter((v) => v.status === k).length}</span></button>`)}</div>
      ${list.length ? html`<div className="list">${list.map((v) => VRow(v, v.status === 'inside' ? html`<div style=${{ marginTop: 8 }}><button className="btn sm" onClick=${() => exit(v)}><${Icon} n="logout" s=${14} />Mark exit</button></div>` : null))}</div>` : html`<div className="empty">Nothing here.</div>`}
    <//>`; }
  else { const list = db.flats.filter((f) => !q || (f.id + f.owner.name + (f.tenant ? f.tenant.name : '')).toLowerCase().includes(q.toLowerCase()));
    body = html`<${Fragment}>
      <div className="search"><${Icon} n="search" s=${15} /><input id="g-search" className="input" style=${{ width: '100%' }} placeholder="Flat number or name" value=${q} onInput=${(e) => setQ(e.target.value)} /></div>
      <div className="list">${list.map((f) => { const who = f.tenant || f.owner; return html`<div key=${f.id} className="li"><span className="flatno" style=${{ width: 48 }}>${f.id}</span><div className="tx"><b>${who.name}</b><span>${f.tenant ? 'Tenant · owner ' + f.owner.name : 'Owner'}</span></div><span className="num" style=${{ fontSize: 12, userSelect: 'all' }}>${who.phone}</span></div>`; })}</div>
    <//>`; }

  return html`<div className="res-stage">
    <${SidePanel} persona=${persona} eyebrow="Guard app · Stage 3" title="Try the gate flows" onSwitch=${onSwitch} onLogout=${onLogout} onReset=${onReset}
      blurb="Ramesh works the main gate on an Android phone. Big buttons, few words, and everything he does reaches the resident straight away."
      steps=${['Verify: scan Meena Nair’s pass (A-302) and let her in. Her pass shows as used in Priya’s app.', 'Walk-in: add a delivery for A-302, then switch to Priya and allow it from her home screen.', 'Mark visitors out as they leave. Sanjay sees the whole log on the admin side.']} />
    <div className="device">
      ${StatusBar}
      <div className="g-head">
        <div style=${{ display: 'flex', alignItems: 'center', gap: 10 }}><${Logo} s=${30} /><div style=${{ flex: 1 }}><b style=${{ fontFamily: 'var(--display)', fontWeight: 500, fontSize: 18 }}>Main gate</b><div style=${{ fontSize: 11.5, color: 'var(--panel-muted)' }}>Aldgate Residency · Day shift 8 am – 8 pm</div></div>
          <button className="icon-btn" style=${{ background: 'var(--panel-2)', borderColor: 'var(--panel-line)', color: 'var(--panel-fg)' }} onClick=${onLogout} aria-label="End shift and log out"><${Icon} n="logout" s=${16} /></button></div>
      </div>
      <div className="app-body" ref=${bodyRef}>${body}</div>
      <nav className="tabbar" style=${{ gridTemplateColumns: 'repeat(4, 1fr)' }} aria-label="Guard">${[['gate', 'Gate', 'grid'], ['verify', 'Verify', 'shield'], ['log', 'Visitor log', 'file'], ['flats', 'Flats', 'building']].map(([k, l, ic]) => html`<button key=${k} className=${tab === k ? 'on' : ''} onClick=${() => setTab(k)} aria-current=${tab === k ? 'page' : undefined}><${Icon} n=${ic} s=${20} />${l}${k === 'gate' && waiting.length ? ' · ' + waiting.length : ''}</button>`)}</nav>
      ${sheet && sheet.kind === 'walkin' && html`<${WalkInSheet} db=${db} update=${update} toast=${toast} onClose=${() => setSheet(null)} />`}
      ${sheet && sheet.kind === 'scan' && html`<${ScanSheet} db=${db} onClose=${() => setSheet(null)} onScan=${(c) => { setSheet(null); setTab('verify'); setCode(c); check(c); }} />`}
    </div>
  </div>`;
}

/* =============================== Admin: Visitor log =============================== */
function Visitors({ db }) {
  const [f, setF] = useState('all');
  const list = db.visitors.filter((v) => f === 'all' || v.status === f);
  const passes = db.gatePasses;
  return html`<${Fragment}>
    <${PageHead} eyebrow="Operations" title="Visitor log" sub="Every entry at the main gate today, from gate passes, walk-ins approved by residents, and daily staff." />
    <div className="metrics">
      <div className="metric"><span className="eyebrow">Inside now</span><span className="val">${db.visitors.filter((v) => v.status === 'inside').length}</span></div>
      <div className="metric"><span className="eyebrow">Entries today</span><span className="val">${db.visitors.filter((v) => v.inAt).length}</span></div>
      <div className="metric"><span className="eyebrow">Waiting at gate</span><span className="val" style=${{ color: 'var(--brass)' }}>${db.visitors.filter((v) => v.status === 'waiting').length}</span></div>
      <div className="metric"><span className="eyebrow">Active gate passes</span><span className="val">${passes.filter((p) => p.status === 'active').length}</span><span className="sub">${passes.filter((p) => p.status === 'used').length} used</span></div>
    </div>
    <div className="card"><div className="card-head"><div className="chips">${[['all', 'All'], ['inside', 'Inside'], ['out', 'Left'], ['waiting', 'Waiting'], ['denied', 'Turned away']].map(([k, l]) => html`<button key=${k} className=${'chip' + (f === k ? ' on' : '')} onClick=${() => setF(k)}>${l}</button>`)}</div><span className="muted" style=${{ fontSize: 12.5 }}>Guard on duty: Ramesh Patil</span></div>
      <div className="table-wrap"><table className="t"><thead><tr><th>Visitor</th><th>Flat</th><th>In</th><th>Out</th><th>Entry by</th><th>Status</th></tr></thead>
        <tbody>${list.map((v) => html`<tr key=${v.id}><td><div className="person"><${VPhoto} v=${v} size=${32} /><div>${v.name}<small>${v.type}${v.vehicle ? ' · ' + v.vehicle : ''}</small></div></div></td><td className="flatno">${v.flat}</td><td className="num">${v.inAt || '—'}</td><td className="num">${v.outAt || '—'}</td><td style=${{ fontSize: 12.5 }}>${v.via}</td><td><span className=${'pill ' + VSTATUS[v.status][0]}>${VSTATUS[v.status][1]}</span></td></tr>`)}</tbody></table></div></div>
  <//>`;
}

/* =============================== App =============================== */
function App() {
  const [db, setDb] = useState(buildSeed);
  const [persona, setPersona] = useState(null);
  const [toasts, setToasts] = useState([]);
  const update = (fn) => setDb((d) => { const n = JSON.parse(JSON.stringify(d)); fn(n); return n; });
  const toast = (msg) => { const id = Math.random(); setToasts((t) => [...t, { id, msg }]); setTimeout(() => setToasts((t) => t.filter((x) => x.id !== id)), 3600); };
  const reset = () => { setDb(buildSeed()); toast('Demo data restored'); };
  const logout = () => { setPersona(null); try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} };
  let view;
  if (!persona) view = html`<${Login} onLogin=${(p) => { setPersona(p); window.scrollTo(0, 0); }} />`;
  else if (persona.key === 'admin') view = html`<${AdminApp} db=${db} update=${update} persona=${persona} onLogout=${logout} onReset=${reset} toast=${toast} />`;
  else if (persona.key === 'owner' || persona.key === 'tenant') view = html`<${ResidentApp} key=${persona.key} db=${db} update=${update} persona=${persona} onLogout=${logout} onReset=${reset} toast=${toast} onSwitch=${(k) => { setPersona(PERSONAS.find((p) => p.key === k)); window.scrollTo(0, 0); }} />`;
  else view = html`<${GuardApp} db=${db} update=${update} persona=${persona} onLogout=${logout} onReset=${reset} toast=${toast} onSwitch=${(k) => { setPersona(PERSONAS.find((p) => p.key === k)); window.scrollTo(0, 0); }} />`;
  return html`<${Fragment}>${view}<div className="toast-zone" aria-live="polite">${toasts.map((t) => html`<div key=${t.id} className="toast"><${Icon} n="check" s=${15} />${t.msg}</div>`)}</div><//>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
})();
</script>

</body>
</html>
